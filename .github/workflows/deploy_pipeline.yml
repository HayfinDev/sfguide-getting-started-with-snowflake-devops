name: Deploy data pipeline

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      REPO_NAME: "quickstart_common.public.quickstart_repo"
      
      SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: "SNOWFLAKE_JWT"
      SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: ".snowflake/snowflake_rsa_key.p8"
      # Read connection secrets
      SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SNOWFLAKE_USER }}
      # Temporary connection (used by -x)
      SNOWFLAKE_AUTHENTICATOR: "SNOWFLAKE_JWT"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_RAW: ".snowflake/snowflake_rsa_key.p8"

      # Optional context
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # Write private key secret as file
      - name: Configure Private Key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > .snowflake/snowflake_rsa_key.p8
          
      - name: Validate required Snowflake secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SNOWFLAKE_ACCOUNT:-}" || (echo "Missing/empty SNOWFLAKE_ACCOUNT secret" && exit 1)
          test -n "${SNOWFLAKE_USER:-}" || (echo "Missing/empty SNOWFLAKE_USER secret" && exit 1)
          test -n "${SNOWFLAKE_PRIVATE_KEY_RAW:-}" || (echo "Missing/empty SNOWFLAKE_PRIVATE_KEY_RAW secret" && exit 1)

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5

      - name: Test connection (temporary)
        run: snow connection test -x

      - name: Fetch repository changes
        run: snow git fetch "@${REPO_NAME}" -x

      - name: Deploy data pipeline to ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "${BRANCH_NAME}" = "main" ]; then
            RETENTION_TIME=1
          else
            RETENTION_TIME=0
          fi

          snow git execute \
            "@${REPO_NAME}/branches/${BRANCH_NAME}/steps/0[134]_*" \
            -D "environment='${BRANCH_NAME}'" \
            -D "retention_time=${RETENTION_TIME}" \
            -x
