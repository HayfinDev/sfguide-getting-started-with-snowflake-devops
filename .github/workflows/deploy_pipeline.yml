name: Deploy data pipeline

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      REPO_NAME: "quickstart_common.public.quickstart_repo"

      # Connection: default
      SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: "SNOWFLAKE_JWT"
      SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: ".snowflake/snowflake_rsa_key"
      SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SNOWFLAKE_USER }}

      # Optional but commonly required by your scripts/DDL
      SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Private Key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .snowflake
          cat > .snowflake/snowflake_rsa_key <<'KEY'
          ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          KEY
          chmod 600 .snowflake/snowflake_rsa_key

      - name: Validate required Snowflake secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT:-}" || (echo "Missing SNOWFLAKE_ACCOUNT secret" && exit 1)
          test -n "${SNOWFLAKE_CONNECTIONS_DEFAULT_USER:-}" || (echo "Missing/empty SNOWFLAKE_USER secret" && exit 1)
          test -s "${SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE:-}" || (echo "Private key file not written" && exit 1)

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0.1

      - name: Test connection
        run: snow connection test -c default

      - name: Fetch repository changes
        run: snow git fetch "@${REPO_NAME}"

      - name: Deploy data pipeline to ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "${BRANCH_NAME}" = "main" ]; then
            RETENTION_TIME=1
          else
            RETENTION_TIME=0
          fi

          snow git execute \
            "@${REPO_NAME}/branches/${BRANCH_NAME}/steps/0[134]_*" \
            -D "environment='${BRANCH_NAME}'" \
            -D "retention_time=${RETENTION_TIME}"
